<div class="grid gap-5 sm:grid-cols-2">
    <div>
        <label for="company" class="mb-2 block text-sm font-semibold text-slate-700">Company <span class="text-red-500">*</span></label>
        <input id="company" name="company" required value="{{ application.get('company', '') }}" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none ring-indigo-500 focus:ring-2">
    </div>
    <div>
        <label for="role" class="mb-2 block text-sm font-semibold text-slate-700">Role <span class="text-red-500">*</span></label>
        <input id="role" name="role" required value="{{ application.get('role', '') }}" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none ring-indigo-500 focus:ring-2">
    </div>
    <div>
        <label for="status" class="mb-2 block text-sm font-semibold text-slate-700">Status</label>
        <select id="status" name="status" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm outline-none ring-indigo-500 focus:ring-2">
            {% for status in statuses %}
                <option value="{{ status }}" {% if application.get('status', 'applied') == status %}selected{% endif %}>{{ status|capitalize }}</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <label for="applied_date" class="mb-2 block text-sm font-semibold text-slate-700">Applied date</label>
        <input id="applied_date" name="applied_date" type="date" value="{{ application.get('applied_date', '') }}" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none ring-indigo-500 focus:ring-2">
    </div>
    <div class="sm:col-span-2">
        <label for="job_url" class="mb-2 block text-sm font-semibold text-slate-700">Job posting URL</label>
        <input id="job_url" name="job_url" type="url" value="{{ application.get('job_url', '') }}" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none ring-indigo-500 focus:ring-2">
    </div>
    <div class="sm:col-span-2">
        <label for="job_description" class="mb-2 block text-sm font-semibold text-slate-700">Job description</label>
        <textarea id="job_description" name="job_description" rows="6" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none ring-indigo-500 focus:ring-2">{{ application.get('job_description', '') }}</textarea>
    </div>
    <div class="sm:col-span-2">
        <label for="notes" class="mb-2 block text-sm font-semibold text-slate-700">Notes</label>
        <textarea id="notes" name="notes" rows="4" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none ring-indigo-500 focus:ring-2">{{ application.get('notes', '') }}</textarea>
    </div>
</div>
