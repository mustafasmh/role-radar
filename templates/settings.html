{% extends "base.html" %}
{% block title %}Settings | ApplyTrack{% endblock %}
{% block content %}
<div class="mx-auto max-w-3xl">
    <div class="mb-8">
        <p class="text-sm font-semibold uppercase tracking-wider text-indigo-600">AI profile</p>
        <h1 class="mt-1 text-3xl font-bold tracking-tight">Settings</h1>
        <p class="mt-2 text-slate-600">Your resume is used to tailor drafts for each application.</p>
    </div>
    <form method="post" class="space-y-6 rounded-xl border border-slate-200 bg-white p-5 shadow-sm sm:p-8">
        <div>
            <label for="resume_text" class="mb-2 block text-sm font-semibold text-slate-700">Resume text</label>
            <textarea id="resume_text" name="resume_text" rows="20" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none ring-indigo-500 focus:ring-2">{{ profile['resume_text'] }}</textarea>
        </div>
        <div class="flex justify-end gap-3 border-t border-slate-100 pt-5">
            <a href="{{ url_for('dashboard') }}" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:text-slate-900">Cancel</a>
            <button type="submit" class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">Save resume</button>
        </div>
    </form>
</div>
{% endblock %}
