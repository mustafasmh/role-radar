{% extends "base.html" %}
{% block title %}Edit application | ApplyTrack{% endblock %}
{% block content %}
<div class="mx-auto max-w-3xl">
    <div class="mb-8">
        <p class="text-sm font-semibold uppercase tracking-wider text-indigo-600">Update opportunity</p>
        <h1 class="mt-1 text-3xl font-bold tracking-tight">Edit application</h1>
    </div>
    <form method="post" class="space-y-6 rounded-xl border border-slate-200 bg-white p-5 shadow-sm sm:p-8">
        {% include "_form.html" %}
        <div class="flex flex-col-reverse gap-3 border-t border-slate-100 pt-5 sm:flex-row sm:items-center sm:justify-between">
            <button type="submit" formmethod="post" formaction="{{ url_for('delete_application', application_id=application['id']) }}" formnovalidate class="px-4 py-2 text-left text-sm font-semibold text-red-600 hover:text-red-800" onclick="return confirm('Delete this application?');">Delete</button>
            <div class="flex items-center justify-end gap-3">
                <a href="{{ url_for('dashboard') }}" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:text-slate-900">Cancel</a>
                <button type="submit" class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">Save changes</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
