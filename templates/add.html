{% extends "base.html" %}
{% block title %}Add application | ApplyTrack{% endblock %}
{% block content %}
<div class="mx-auto max-w-3xl">
    <div class="mb-8">
        <p class="text-sm font-semibold uppercase tracking-wider text-indigo-600">New opportunity</p>
        <h1 class="mt-1 text-3xl font-bold tracking-tight">Add an application</h1>
    </div>
    <form method="post" class="space-y-6 rounded-xl border border-slate-200 bg-white p-5 shadow-sm sm:p-8">
        {% include "_form.html" %}
        <div class="flex items-center justify-end gap-3 border-t border-slate-100 pt-5">
            <a href="{{ url_for('dashboard') }}" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:text-slate-900">Cancel</a>
            <button type="submit" class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">Save application</button>
        </div>
    </form>
</div>
{% endblock %}
